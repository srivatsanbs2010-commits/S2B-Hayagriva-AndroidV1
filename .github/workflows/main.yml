name: Build S2B Hayagriva APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build-apk:
    name: Build S2B Hayagriva
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"
          yes | sdkmanager --licenses || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Check project files
        run: |
          echo "===== PROJECT FILES ====="
          find . -maxdepth 4 -type f | sort
          echo "========================="

          test -f build.gradle
          test -f settings.gradle
          test -f AndroidManifest.xml
          test -f MainActivity.java
          test -f res/values/styles.xml

          echo "All required Hayagriva files found."

      - name: Show Gradle tasks
        run: |
          gradle --no-daemon tasks --all

      - name: Build Hayagriva APK
        run: |
          gradle --no-daemon assembleDebug

      - name: Verify APK
        run: |
          echo "Searching for generated APK..."
          find . -type f -name "*.apk" -print

          test -f build/outputs/apk/debug/app-debug.apk

          echo "APK successfully created:"
          ls -lh build/outputs/apk/debug/app-debug.apk

      - name: Rename APK
        run: |
          cp build/outputs/apk/debug/app-debug.apk \
             build/outputs/apk/debug/S2B-Hayagriva-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: S2B-Hayagriva-APK
          path: build/outputs/apk/debug/S2B-Hayagriva-debug.apk
          if-no-files-found: error
          retention-days: 30

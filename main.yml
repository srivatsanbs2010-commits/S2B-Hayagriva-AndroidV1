name: Build S2B Hayagriva APK

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          yes | sdkmanager --licenses >/dev/null || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Verify Gradle project
        run: gradle --no-daemon projects

      - name: Verify Android build tasks
        run: gradle --no-daemon tasks --all | grep -E "assemble(Debug|Release)"

      - name: Build Debug APK
        run: gradle --no-daemon renameDebugApk

      - name: Locate APK
        run: |
          find build/outputs/apk -type f -name "*.apk" -print
          test -f build/outputs/apk/debug/S2B-Hayagriva-debug.apk

      - name: Rename APK for artifact
        run: cp build/outputs/apk/debug/S2B-Hayagriva-debug.apk S2B-Hayagriva-debug.apk

      - name: Upload S2B Hayagriva APK
        uses: actions/upload-artifact@v4
        with:
          name: S2B-Hayagriva-debug-APK
          path: S2B-Hayagriva-debug.apk
          if-no-files-found: error
          retention-days: 30
